<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消費者目線ニュース</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7375846487634521" crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="aikon2.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --camel: #A0826D; --camel-light: #C4A57B; --camel-dark: #6B5A4F;
            --bg: #FEF6F0; --tx: #3D2817; --td: #9B8B7F; --bo: #E8D5C4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--tx); font-family: 'Noto Sans JP', sans-serif; line-height: 1.6; }
        
        /* ヘッダー */
        .site-header { background: var(--camel-dark); color: white; padding: 1rem; border-bottom: 3px solid var(--camel); }
        .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 15px; }
        .header-icon { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #fff; }
        .site-title { font-family: 'Noto Serif JP', serif; font-size: 22px; }

        /* レイアウト */
        .container { max-width: 1200px; margin: 20px auto; display: grid; grid-template-columns: 1fr 300px; gap: 30px; padding: 0 15px; }
        @media (max-width: 850px) { .container { grid-template-columns: 1fr; } .sidebar { display: none; } }

        /* 記事カード */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #fff; border: 1px solid var(--bo); border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #eee; }
        .card-body { padding: 15px; }
        .card-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; height: 3em; overflow: hidden; }
        
        /* サイドバー */
        .side-block { background: #fff; border: 1px solid var(--bo); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .side-title { font-size: 14px; font-weight: bold; border-bottom: 2px solid var(--camel); margin-bottom: 15px; padding-bottom: 5px; }
        .side-item { display: flex; gap: 10px; margin-bottom: 12px; cursor: pointer; }
        .side-thumb { width: 60px; height: 40px; object-fit: cover; border-radius: 4px; }
        .side-text { font-size: 12px; font-weight: bold; line-height: 1.3; }

        /* 記事詳細表示モーダル */
        #detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; display: none; overflow-y: auto; padding: 20px; }
        .detail-content { background: #fff; max-width: 800px; margin: 0 auto; border-radius: 12px; overflow: hidden; position: relative; }
        .close-btn { position: sticky; top: 10px; float: right; margin-right: 10px; background: #000; color: #fff; border: none; padding: 5px 15px; border-radius: 20px; cursor: pointer; z-index: 11; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .detail-body { padding: 25px; }
        .detail-body h2 { margin-bottom: 15px; font-size: 20px; }
        .detail-text { white-space: pre-wrap; font-size: 16px; color: #444; }

        /* 広告バナー */
        .ad-space { text-align: center; margin: 20px 0; }
        
        /* トップへ戻る */
        #topBtn { position: fixed; bottom: 20px; right: 20px; background: var(--camel-dark); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: none; z-index: 999; }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <img src="aikon2.png" class="header-icon">
        <div class="site-title">消費者目線ニュース</div>
    </div>
</header>

<div class="container">
    <main>
        <div class="ad-space">
            <a href="https://hb.afl.rakuten.co.jp/hsc/3e527b14.9967732a.3e527b15.00632df3/?link_type=hybrid_ad_res&ut=eyJwYWdlIjoiaHlwZXJsaW5rIiwidHlwZSI6Imh5YnJpZF9hZF9yZXMiLCJjb2wiOjEsImFkIjoianVzdGZpdCIsInB0biI6MX0%3D" target="_blank">
                <img src="https://hbb.afl.rakuten.co.jp/hsb/3e527b14.9967732a.3e527b15.00632df3/?me_id=1&me_adv_id=1073105&t=res" alt="広告">
            </a>
        </div>

        <div class="grid" id="article-grid">
            <p>読み込み中...</p>
        </div>
    </main>

    <aside class="sidebar">
        <div class="side-block">
            <div class="side-title">ABOUT</div>
            <div style="text-align:center;">
                <img src="aikon2.png" style="width:80px; border-radius:50%; margin-bottom:10px;">
                <p style="font-size:13px;"><b>店長</b><br>北海道から消費者目線でニュースを解説しています。</p>
            </div>
        </div>
        
        <div class="side-block">
            <div class="side-title">最新記事</div>
            <div id="side-list"></div>
        </div>

        <div class="side-block">
            <div class="side-title">スポンサー</div>
            <a href="https://px.a8.net/svt/ejp?a8mat=3Z9N56+8U5Z02+50+2HQO01" rel="nofollow">
                <img border="0" width="100%" alt="" src="https://www27.a8.net/svt/bgt?aid=240523450098&wid=001&eno=01&mid=s00000000018015053000&mc=1">
            </a>
        </div>
    </aside>
</div>

<div id="detail-overlay">
    <div class="detail-content">
        <button class="close-btn" onclick="closeDetail()">閉じる ×</button>
        <div id="detail-view"></div>
    </div>
</div>

<button id="topBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLXT6i0DsJxdixNAai_L7EVM6vNZMhqT9Yt3zQLAxyBdBAzkaAJ_fE6zUVtooaNqXKyNbhP2S-B-Cm/pub?gid=886500697&single=true&output=csv';
let articles = [];

// YouTubeのIDを抽出してサムネイルを取得
function getYoutubeInfo(url) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
    const match = url.match(regExp);
    const id = (match && match[2].length == 11) ? match[2] : null;
    return {
        id: id,
        thumb: id ? `https://img.youtube.com/vi/${id}/maxresdefault.jpg` : 'aikon2.png'
    };
}

// CSVを解析
async function loadData() {
    try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        const rows = csvText.split('\n').slice(1);
        
        articles = rows.map(row => {
            const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if(cols.length < 3) return null;
            const url = cols[5]?.replace(/"/g, '').trim() || '';
            const yt = getYoutubeInfo(url);
            return {
                date: cols[0]?.replace(/"/g, '').trim(),
                title: cols[1]?.replace(/"/g, '').trim(),
                body: cols[2]?.replace(/"/g, '').trim(),
                videoUrl: url,
                videoId: yt.id,
                thumb: yt.thumb
            };
        }).filter(a => a);

        renderArticles();
        renderSidebar();
    } catch (e) {
        console.error("データの読み込みに失敗しました", e);
    }
}

// メイン記事一覧を表示
function renderArticles() {
    const grid = document.getElementById('article-grid');
    grid.innerHTML = articles.map((a, i) => `
        <div class="card" onclick="openDetail(${i})">
            <img src="${a.thumb}" class="thumb">
            <div class="card-body">
                <div style="font-size:11px; color:#999;">${a.date}</div>
                <div class="card-title">${a.title}</div>
                <div style="color:var(--camel); font-size:12px; font-weight:bold;">記事を読む →</div>
            </div>
        </div>
    `).join('');
}

// サイドバーの最新記事を表示
function renderSidebar() {
    const side = document.getElementById('side-list');
    side.innerHTML = articles.slice(0, 5).map((a, i) => `
        <div class="side-item" onclick="openDetail(${i})">
            <img src="${a.thumb}" class="side-thumb">
            <div class="side-text">${a.title}</div>
        </div>
    `).join('');
}

// 記事詳細を開く
function openDetail(index) {
    const a = articles[index];
    const view = document.getElementById('detail-view');
    
    let videoHtml = '';
    if (a.videoId) {
        videoHtml = `<div class="video-container"><iframe src="https://www.youtube.com/embed/${a.videoId}?autoplay=1" frameborder="0" allowfullscreen></iframe></div>`;
    }

    view.innerHTML = `
        ${videoHtml}
        <div class="detail-body">
            <div style="color:#999; font-size:13px; margin-bottom:10px;">${a.date}</div>
            <h2>${a.title}</h2>
            <div class="detail-text">${a.body}</div>
            <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
            <div class="ad-space">
                <p style="font-size:10px; color:#ccc; margin-bottom:5px;">スポンサーリンク</p>
                <a href="https://hb.afl.rakuten.co.jp/hsc/3e527b14.9967732a.3e527b15.00632df3/?link_type=hybrid_ad_res&ut=eyJwYWdlIjoiaHlwZXJsaW5rIiwidHlwZSI6Imh5YnJpZF9hZF9yZXMiLCJjb2wiOjEsImFkIjoianVzdGZpdCIsInB0biI6MX0%3D" target="_blank">
                    <img src="https://hbb.afl.rakuten.co.jp/hsb/3e527b14.9967732a.3e527b15.00632df3/?me_id=1&me_adv_id=1073105&t=res" width="100%">
                </a>
            </div>
        </div>
    `;
    document.getElementById('detail-overlay').style.display = 'block';
    document.body.style.overflow = 'hidden'; // 背景スクロール禁止
}

function closeDetail() {
    document.getElementById('detail-overlay').style.display = 'none';
    document.getElementById('detail-view').innerHTML = '';
    document.body.style.overflow = 'auto';
}

// トップへ戻るボタン
window.onscroll = function() {
    const btn = document.getElementById('topBtn');
    if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
        btn.style.display = "block";
    } else {
        btn.style.display = "none";
    }
};

loadData();
</script>
</body>
</html>
