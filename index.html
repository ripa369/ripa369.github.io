<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>消費者目線ニュース</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7375846487634521" crossorigin="anonymous"></script>
<link rel="icon" type="image/png" href="aikon2.png" />
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --camel:#A0826D;--camel-light:#C4A57B;--camel-dark:#6B5A4F;
  --bg:#FEF6F0;--bg2:#FFFBF7;--bg3:#FFFFFF;
  --bo:#E8D5C4;--bor:rgba(160,130,109,0.2);
  --tx:#3D2817;--ts:#6B5A4F;--td:#9B8B7F;
}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans JP',sans-serif;}
.site-header{background:var(--camel-dark);border-bottom:3px solid var(--camel);}
.header-top{max-width:1200px;margin:0 auto;padding:0.75rem 1rem;display:flex;align-items:center;gap:1rem;}
.header-icon{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid rgba(255,255,255,0.3);}
.site-name{font-family:'Noto Serif JP',serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:0.05em;}
.site-name span{color:var(--camel-light);}
.site-tagline{font-size:11px;color:rgba(255,255,255,0.9);margin-top:2px;}
.header-search{margin-left:auto;display:flex;align-items:center;gap:6px;}
.search-wrap{position:relative;}
.search-input{background:#fff;border:1px solid var(--bo);color:var(--tx);font-family:'Noto Sans JP',sans-serif;font-size:12px;padding:6px 10px 6px 28px;outline:none;transition:border-color 0.2s;width:200px;border-radius:3px;}
.search-input:focus{border-color:var(--camel);}
.search-input::placeholder{color:#ccc;}
.search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);opacity:0.5;pointer-events:none;}
.search-clear{background:transparent;border:none;color:#ddd;cursor:pointer;font-size:16px;line-height:1;}
.search-clear:hover{color:var(--tx);}
.search-count{font-size:11px;color:#aaa;white-space:nowrap;}
.nav-bar{background:var(--camel-dark);border-bottom:1px solid rgba(0,0,0,0.1);}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;overflow-x:auto;}
.ntab{padding:0.65rem 1.1rem;font-size:13px;cursor:pointer;background:transparent;color:rgba(255,255,255,0.8);font-family:'Noto Sans JP',sans-serif;border:none;border-bottom:3px solid transparent;white-space:nowrap;transition:all 0.15s;}
.ntab:hover{color:#fff;background:rgba(255,255,255,0.08);}
.ntab.active{color:#fff;border-bottom-color:var(--camel-light);background:rgba(196,165,123,0.2);}
.new-dot{display:inline-block;width:7px;height:7px;background:var(--camel-light);border-radius:50%;margin-left:4px;vertical-align:middle;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.ad-top-wrap{background:#FBEEE7;border-bottom:1px solid var(--bo);}
.ad-top{max-width:1200px;margin:0 auto;padding:0.5rem 1rem;display:flex;align-items:center;gap:10px;}
.ad-label{font-size:9px;color:var(--td);letter-spacing:0.15em;border:1px solid var(--bo);padding:1px 5px;flex-shrink:0;}

/* 2列表示レイアウト */
.page{max-width:1200px;margin:0 auto;padding:1.25rem 1rem;display:grid;grid-template-columns:1fr 300px;gap:1.5rem;}
@media(max-width:860px){.page{grid-template-columns:1fr;}.sidebar{display:none;}}

.section-label{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:0.75rem;padding-bottom:0.6rem;border-bottom:2px solid var(--camel);}

/* 記事カードを2列にする設定 */
.grid-list{display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:1rem;}
@media(max-width:600px){.grid-list{grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));gap:10px;}}

.grid-card{background:var(--bg3);border:1px solid var(--bo);border-radius:6px;overflow:hidden;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;box-shadow:0 2px 6px rgba(107,90,79,0.05);}
.grid-card:hover{border-color:var(--camel);transform:translateY(-2px);box-shadow:0 6px 16px rgba(160,130,109,0.12);}
.thumb-wrap{position:relative;width:100%;padding-top:56.25%;background:#eee;}
.thumb-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
.grid-body{padding:0.75rem;display:flex;flex-direction:column;flex:1;}
.grid-title{font-family:'Noto Serif JP',serif;font-size:12px;font-weight:700;color:var(--tx);line-height:1.6;flex:1;}

/* カルーセルのデザイン */
.carousel-container { max-width: 1200px; margin: 1rem auto; overflow: hidden; }
.carousel-track { display: flex; gap: 15px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 10px; scrollbar-width: none; }
.carousel-track::-webkit-scrollbar { display: none; }
.carousel-item { flex: 0 0 85%; scroll-snap-align: center; background: var(--camel-dark); border-radius: 12px; position: relative; aspect-ratio: 16 / 9; }

/* サイドバー */
.sidebar-block{margin-bottom:1.5rem;}
.sidebar-title{font-size:12px;font-weight:700;color:var(--tx);padding-bottom:0.5rem;border-bottom:2px solid var(--camel);margin-bottom:0.75rem;}
.side-item{display:flex;gap:10px;padding:0.6rem 0;border-bottom:1px solid var(--bo);cursor:pointer;}
.side-thumb{width:72px;height:48px;flex-shrink:0;background:#eee;overflow:hidden;border-radius:3px;}
.side-thumb img{width:100%;height:100%;object-fit:cover;}
.side-info{flex:1;min-width:0;}
.side-title{font-size:12px;font-weight:700;color:var(--tx);line-height:1.5;}

/* トップへ戻るボタン */
#back-to-top { position: fixed; bottom: 25px; right: 25px; width: 50px; height: 50px; border-radius: 50%; background: var(--camel-dark); color: white; border: none; cursor: pointer; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 9999; font-size: 24px; }

/* 共通パーツ */
.cat-badge{font-size:9px;padding:2px 7px;border:1px solid;letter-spacing:0.08em;font-weight:700;border-radius:2px;}
.cat-新着{border-color:var(--camel-light);color:var(--camel);background:rgba(196,165,123,0.1);}
.cat-その他{border-color:var(--td);color:var(--td);}
.art-date{font-size:11px;color:var(--td);}
.read-btn{display:block;width:100%;padding:7px;border:1px solid var(--camel);background:transparent;color:var(--camel);font-size:11px;cursor:pointer;text-align:center;border-radius:4px;margin-top:8px;}

/* ドロワーメニュー */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:8000;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.drawer-overlay.show{opacity:1;pointer-events:all;}
.drawer{position:fixed;top:0;left:0;width:280px;height:100%;background:var(--camel-dark);z-index:8001;transform:translateX(-100%);transition:transform 0.3s;}
.drawer.open{transform:translateX(0);}
</style>
</head>
<body>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div id="drawerContent"></div>
</div>

<div class="site-header">
  <div class="header-top">
    <button class="menu-btn" id="menuBtn" onclick="toggleDrawer()">☰</button>
    <img class="header-icon" src="aikon2.png" />
    <div>
      <div class="site-name">消費者目線<span>ニュース</span></div>
      <div class="site-tagline">あなたの財布に直結するニュースを動画で解説</div>
    </div>
    <div class="header-search">
      <input class="search-input" id="sq" type="text" placeholder="記事を検索..." oninput="onSearch()" />
    </div>
  </div>
</div>

<section class="carousel-container">
    <div class="carousel-track">
        <div class="carousel-item">
            <div style="padding: 20px; color: white;">
                <h3>【注目】今週の家計に響くニュース</h3>
                <p>店長が動画で詳しく解説中！</p>
            </div>
        </div>
        <div class="carousel-item">
            <div style="padding: 20px; color: white;">
                <h3>【人気】北海道の最新スポット</h3>
                <p>小売店の視点でチェック</p>
            </div>
        </div>
    </div>
</section>

<div class="nav-bar"><div class="nav-inner" id="nav"></div></div>

<div id="main-area"><div class="loading">記事を読み込んでいます</div></div>

<button id="back-to-top">↑</button>

<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRLXT6i0DsJxdixNAai_L7EVM6vNZMhqT9Yt3zQLAxyBdBAzkaAJ_fE6zUVtooaNqXKyNbhP2S-B-Cm/pub?gid=886500697&single=true&output=csv';
const CATS=['新着','全て','政治','経済','国際','生活','SNS','その他'];
let arts=[],curCat='新着',curDet=null,searchQ='';

function parseCSV(t){const rows=[];let row=[],cell='',inQ=false;for(let i=0;i<t.length;i++){const c=t[i];if(inQ){if(c==='"'&&t[i+1]==='"'){cell+='"';i++;}else if(c==='"')inQ=false;else cell+=c;}else{if(c==='"')inQ=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'||(c==='\r'&&t[i+1]==='\n')){if(c==='\r')i++;row.push(cell);cell='';rows.push(row);row=[];}else cell+=c;}}if(cell||row.length){row.push(cell);rows.push(row);}return rows;}

async function fetchArticles(){
  const res=await fetch(CSV_URL);
  const text=await res.text();
  const rows=parseCSV(text);
  return rows.slice(1).filter(r=>r.some(c=>c.trim())).map((r,i)=>({
    id:String(i+1),
    date:(r[0]||'').trim(),
    title:(r[1]||'').trim(),
    body:(r[2]||'').trim(),
    rawUrl:(r[5]||'').trim(),
    thumbnail:resolveThumb((r[5]||'').trim()),
    category:(r[6]||'その他').trim(),
  }));
}

function getYtId(url){
  const m=url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([^&?/\s]+)/);
  return m?m[1]:'';
}

function resolveThumb(url){
  const ytId=getYtId(url);
  return ytId ? `https://img.youtube.com/vi/${ytId}/maxresdefault.jpg` : url;
}

function isNew(date){
  const d=new Date(date);
  const now=new Date();
  return(now-d)/(1000*60*60*24)<=7;
}

function renderMain(){
  const el=document.getElementById('main-area');
  const fil=arts.filter(a=>searchQ ? a.title.includes(searchQ) : (curCat==='新着' ? isNew(a.date) : (curCat==='全て' ? true : a.category===curCat)));
  
  const sideArts = arts.slice(0, 6);
  
  el.innerHTML=`
    <div class="page">
      <div class="main">
        <div class="section-label">${curCat}</div>
        <div class="grid-list">
          ${fil.map(a=>`
            <div class="grid-card" onclick="alert('記事詳細ページへ')">
              <div class="thumb-wrap"><img class="thumb-img" src="${a.thumbnail}"></div>
              <div class="grid-body">
                <div class="grid-meta"><span class="cat-badge cat-${a.category}">${a.category}</span> <span class="art-date">${a.date}</span></div>
                <div class="grid-title">${a.title}</div>
                <button class="read-btn">記事を読む</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="sidebar">
        <div class="sidebar-title">最新記事</div>
        ${sideArts.map(a=>`
          <div class="side-item">
            <div class="side-thumb"><img src="${a.thumbnail}"></div>
            <div class="side-info"><div class="side-title">${a.title}</div></div>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderNav(){
  document.getElementById('nav').innerHTML=CATS.map(c=>`<button class="ntab ${curCat===c?'active':''}" onclick="curCat='${c}';renderMain()">${c}</button>`).join('');
}

function onSearch(){searchQ=document.getElementById('sq').value;renderMain();}

// トップへ戻るボタンの制御
const btt = document.getElementById('back-to-top');
window.addEventListener('scroll', () => {
    if (window.pageYOffset > 300) { btt.style.display = 'flex'; } 
    else { btt.style.display = 'none'; }
});
btt.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

fetchArticles().then(data=>{arts=data;renderNav();renderMain();});

function toggleDrawer(){ document.getElementById('drawer').classList.toggle('open'); document.getElementById('drawerOverlay').classList.toggle('show'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('show'); }
</script>
</body>
</html>
